<mjml>
  <mj-head>
    <mj-title>{{titolo}}</mj-title>
    <mj-preview>{{messaggio}}</mj-preview>
    <mj-attributes>
      <mj-all font-family="'Open Sans', Arial, sans-serif" />
      <mj-section background-color="#ffffff" padding="0 36px" />
      <mj-text color="#14181f" font-size="15px" line-height="1.6" padding="0" />
      <mj-button background-color="#2463eb" color="#ffffff" border-radius="12px" font-weight="700" inner-padding="14px 28px" align="left" />
    </mj-attributes>
  </mj-head>
  <mj-body background-color="#f9fafb">
    <mj-section background-color="#2463eb" padding="24px 36px">
      <mj-column>
        <mj-text color="#ffffff" font-size="18px" font-weight="700" padding="0">
          <img src="https://media.base44.com/images/public/69df26522754d022dfa80e75/aee9cada1_Blanchin-Simbolo-Colore-223232.png" alt="EveryDay 4.0" width="34" style="vertical-align:middle;margin-right:10px;" />EveryDay 4.0
        </mj-text>
      </mj-column>
    </mj-section>

    <mj-section padding="36px 36px 8px">
      <mj-column>
        <mj-text font-size="26px" font-weight="700" line-height="1.25" padding="0 0 8px 0">{{titolo}}</mj-text>
        <mj-text color="#6a7181" font-size="15px" padding="0">{{messaggio}}</mj-text>
      </mj-column>
    </mj-section>

    <mj-section padding="12px 36px 24px">
      <mj-column>
        <mj-text background-color="#f9fafb" border="1px solid #e0e5eb" border-radius="12px" padding="18px 20px" font-size="16px" color="#14181f">
          {{dettaglio}}
        </mj-text>
      </mj-column>
    </mj-section>

    <mj-section padding="0 36px 36px">
      <mj-column>
        <mj-button href="https://everyday-4-0.base44.app/task">Apri i task</mj-button>
      </mj-column>
    </mj-section>

    <mj-section background-color="#f9fafb" padding="24px 36px">
      <mj-column>
        <mj-text color="#6a7181" font-size="12px" padding="0">EveryDay 4.0 · notifica automatica dei task</mj-text>
      </mj-column>
    </mj-section>
  </mj-body>
</mjml>
